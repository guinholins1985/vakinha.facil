        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#2563EB', // blue-600

            fontFamily: {

              heading: ['Poppins', 'sans-serif'],
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(-10px)' },

              },
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
            },
          },
        },
      }
    </script>
