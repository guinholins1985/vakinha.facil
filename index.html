<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF--vsc" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vakinha Fácil - Vaquinhas Coletivas Automatizadas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                light: '#34D399', // emerald-400
                DEFAULT: '#10B981', // emerald-500
                dark: '#059669', // emerald-600
              },
              secondary: '#F59E0B', // amber-500
              neutral: {
                dark: '#1A1A2E',
                light: '#F8F9FA'
              },
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Poppins', 'sans-serif'],
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              pulse: {
                '50%': {
                  opacity: '.85',
                },
              },
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-in-out',
              'pulse-subtle': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
          },
        },
      }
    </script>
